name: us_swing_trend
display_name: 美股中线趋势
description: >
  用于美股 2 周到 3 个月周期的趋势跟随与回调分析，
  结合 20/50/200 日趋势、20 日突破、成交量确认、ATR 风控、
  基本面变化与新闻催化。

category: trend

aliases:
  - 美股中线
  - 美股趋势
  - US swing
  - US trend

default_active: false
default_router: false
default_priority: 50
user_invocable: true

market_regimes:
  - bull
  - neutral

instructions: |
  你正在执行“美股中线趋势”分析。

  ## 一、分析周期
  以日线为主，目标持有周期通常为 2 周至 3 个月。
  不以分钟级、日内或超短线波动作为主要决策依据。

  ## 二、趋势优先
  优先检查：
  - 20 日均线
  - 50 日均线
  - 200 日均线
  - 20 日高点
  - 成交量变化
  - ATR 波动率

  趋势判断原则：
  - 股价位于 50 日均线上方：中期趋势偏强
  - 50 日均线位于 200 日均线上方：中长期结构健康
  - 股价跌破 50 日均线：需要重新评估中期趋势
  - 股价跌破 200 日均线：视为长期趋势明显转弱

  ## 三、突破信号
  高质量突破需要同时满足或接近以下条件：
  - 收盘价突破最近 20 个交易日高点
  - 成交量明显放大
  - 当日成交量优先达到 20 日平均成交量的 1.5 倍以上
  - 突破时不能明显远离合理均线区间
  - 若突破无量，降低信号质量

  ## 四、回调信号
  在已有上升趋势中，重点寻找：
  - 回踩 20 日均线或 50 日均线
  - 回调期间成交量缩小
  - 未跌破中期趋势结构
  - 回调后重新出现止跌或放量转强

  对强趋势股票，回调买点优先于追高买点。

  ## 五、ATR 风险控制
  风险位优先参考 ATR：
  - 初始风险控制可参考约 2×ATR
  - 盈利后可参考约 3×ATR 的跟踪保护
  - ATR 只作为波动率风险参考，不作为机械交易指令

  ## 六、基本面确认
  技术趋势不能脱离基本面背景。

  重点检查：
  - 最近季度营收变化
  - EPS 增长或下滑
  - 毛利率和营业利润率
  - 自由现金流
  - 下一季度和全年 Guidance
  - 分析师盈利预期是否上调或下调

  如果价格趋势强，但盈利预期持续下修，应降低结论置信度。

  ## 七、估值
  对美股应结合：
  - Forward P/E
  - PEG
  - EV/EBITDA
  - 自由现金流收益率
  - 公司自身历史估值
  - 同行业估值

  不因估值偏高直接否定强趋势，但要明确标注估值风险。

  ## 八、催化剂
  重点识别未来 1-3 个月的催化：
  - 财报
  - Guidance
  - 分析师预期调整
  - 大订单
  - 新产品
  - AI / 云计算 / 半导体资本开支
  - 行业景气变化
  - 监管变化

  ## 九、风险
  必须重点检查：
  - 高估值
  - EPS 预期下修
  - Guidance 下调
  - 毛利率恶化
  - 行业周期见顶
  - 跌破 50 日均线
  - 跌破 200 日均线
  - 财报前后的高波动风险

  ## 十、输出要求
  最终分析至少包含：
  1. 当前趋势：突破 / 回调 / 盘整 / 转弱
  2. 20/50/200 日趋势结构
  3. 关键支撑位
  4. 关键压力位
  5. 是否存在高质量突破信号
  6. 是否存在低风险回调机会
  7. ATR 风险参考位
  8. 当前估值状态
  9. 基本面是否支持当前趋势
  10. 未来 1-3 个月主要催化剂
  11. 最大的 3 个风险
  12. 什么条件下趋势进一步转强
  13. 什么条件下需要重新评估或降低仓位

  不要只根据单日涨跌给出结论。
  不要只根据 MA5 / MA10 给出中线判断。
  优先采用“趋势 + 成交量 + 基本面 + 催化剂 + 风险”综合判断。
